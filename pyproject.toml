[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-serial-tool"
version = "0.2.0"
description = "跨平台轻量级串口调试工具（Windows + Linux）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EDISON" }]
dependencies = [
    "pyserial>=3.5",
    "openpyxl>=3.0",
]

[project.scripts]
ecom = "ecom.cli:main"

[tool.setuptools.packages.find]
include = ["ecom*"]

[tool.setuptools.package-data]
ecom = ["docs/*.md"]
